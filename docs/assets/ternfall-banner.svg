  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="64" y="68" font-size="15" fill="#5eead4" letter-spacing="4">THE QUIET HOURS / ORIGINAL SURVIVAL THRILLER</text>
    <text x="60" y="162" font-size="76" font-weight="700" fill="#f1f5f9" letter-spacing="-3">TERNFALL</text>
    <text x="64" y="207" font-size="28" fill="#cbd5e1" letter-spacing="12">STUDIO</text>
    <text x="64" y="268" font-size="20" fill="#fbbf24">Original stories. Measured evidence.</text>
    <text x="64" y="298" font-size="20" fill="#fbbf24">Human decisions.</text>
    <text x="64" y="377" font-size="13" fill="#94a3b8" letter-spacing="2">LOCAL-FIRST / DRAFT → INSPECT → RENDER → VERIFY</text>
    <text x="1000" y="377" font-size="12" fill="#5eead4" letter-spacing="2">SOUTH GATE / 01</text>
